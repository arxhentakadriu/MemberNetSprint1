# Application
spring.application.name=membernet
server.port=8080

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/membernet_sprint2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Optional bootstrap administrator
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${ADMIN_FIRST_NAME:Admin}
app.bootstrap.admin.last-name=${ADMIN_LAST_NAME:User}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.membernet

app.security.session-protection.enabled=${SESSION_PROTECTION_ENABLED:true}
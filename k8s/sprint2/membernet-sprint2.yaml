apiVersion: v1
kind: Namespace
metadata:
  name: membernet

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: membernet-config
  namespace: membernet
data:
  DB_URL: jdbc:postgresql://postgres:5432/membernet_sprint2
  DB_USERNAME: postgres
  ADMIN_FIRST_NAME: Admin
  ADMIN_LAST_NAME: User

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: membernet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: membernet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: membernet_sprint2
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: membernet-config
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: membernet-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d membernet_sprint2
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d membernet_sprint2
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: membernet
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: membernet
  namespace: membernet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: membernet
  template:
    metadata:
      labels:
        app: membernet
        spec:
      containers:
        - name: membernet
          image: arxhenta/membernet-sprint2:fix-admin-login
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: membernet-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: membernet-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: membernet-secrets
                  key: DB_PASSWORD
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: membernet-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: membernet-secrets
                  key: ADMIN_PASSWORD
                  optional: true
            - name: ADMIN_FIRST_NAME
              valueFrom:
                configMapKeyRef:
                  name: membernet-config
                  key: ADMIN_FIRST_NAME
            - name: ADMIN_LAST_NAME
              valueFrom:
                configMapKeyRef:
                  name: membernet-config
                  key: ADMIN_LAST_NAME
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: membernet
  namespace: membernet
spec:
  selector:
    app: membernet
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
